<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>词库 Playground — 分层替换卡片测试</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=Noto+Sans+SC:wght@400;500;700;900&family=JetBrains+Mono:wght@400;500;700&family=Caveat:wght@500;600;700&display=swap');
:root {
  --green: #53131E;      /* 主强调（可替换词）= 深酒红 */
  --yellow: #9C5A63;     /* 填充词 = 暗玫瑰 */
  --magenta: #5A464C;    /* 犹豫词 = 灰褐 */
  --bg: #FFFACC;         /* 浅黄纸 */
  --paper-2: #F5EEB8;
  --ink: #53131E;        /* 正文 = 深酒红 */
  --ink-light: #5A464C;  /* 弱化灰褐 */
  --line: rgba(83,19,30,0.18);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'Noto Serif SC', "Songti SC", serif;
  background: var(--bg);
  min-height: 100vh;
  padding: 40px;
  color: var(--ink);
}

h1 {
  font-family: 'Noto Serif SC', serif;
  font-size: 34px;
  font-weight: 500;
  margin-bottom: 8px;
}

.subtitle {
  font-family: 'JetBrains Mono', monospace;
  color: var(--ink-light);
  font-size: 12px;
  line-height: 1.7;
  letter-spacing: 0.03em;
  margin-bottom: 28px;
  padding-bottom: 16px;
  border-bottom: 2px solid var(--ink);
}

.main-layout {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 32px;
  max-width: 1200px;
}

/* 左侧：输入区 */
.input-area {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.input-area textarea {
  width: 100%;
  min-height: 200px;
  padding: 20px;
  background: var(--bg);
  border: 1px solid var(--ink);
  border-radius: 0;
  color: var(--ink);
  font-family: 'Noto Serif SC', serif;
  font-size: 16px;
  line-height: 1.8;
  resize: vertical;
  outline: none;
  transition: box-shadow 0.15s;
}

.input-area textarea:focus {
  box-shadow: inset 0 0 0 1px var(--ink);
}

.input-area .hint {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  line-height: 1.6;
  color: var(--ink-light);
}

/* 高亮输出区 */
.output-area {
  background: var(--bg);
  border-radius: 0;
  padding: 24px;
  min-height: 200px;
  line-height: 2;
  font-size: 16px;
  border: 1px solid var(--ink);
}

.output-area .highlight {
  color: var(--green);
  padding: 0 2px;
  cursor: pointer;
  font-weight: 600;
  border-bottom: 2px dashed var(--green);
  position: relative;
  transition: background 0.2s;
}

.output-area .highlight:hover {
  background: rgba(32, 30, 224, 0.1);
}

.output-area .highlight-filler {
  color: var(--yellow);
  padding: 0 2px;
  font-weight: 600;
  text-decoration: underline wavy;
}

.output-area .highlight-hedge {
  color: var(--magenta);
  padding: 0 2px;
  font-weight: 600;
  border-bottom: 1px solid var(--magenta);
}

/* 右侧：替换卡片 */
.card-panel {
  position: sticky;
  top: 40px;
}

.card-panel h2 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 2px solid var(--ink);
  color: var(--ink);
}

.replacement-card {
  background: var(--bg);
  border-radius: 0;
  padding: 20px;
  border: 1px solid var(--ink);
  margin-bottom: 12px;
  animation: slideIn 0.2s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.replacement-card .original {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--ink-light);
  margin-bottom: 8px;
}

.replacement-card .word {
  font-family: 'Noto Serif SC', serif;
  font-size: 28px;
  font-weight: 500;
  color: var(--green);
  margin-bottom: 12px;
}

.replacement-card .category {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--paper-2);
  margin-bottom: 14px;
  padding: 3px 10px;
  background: var(--ink);
  border-radius: 0;
  display: inline-block;
}

.replacement-card .alternatives {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.replacement-card .alt-chip {
  padding: 6px 14px;
  background: transparent;
  border: 1px solid var(--ink);
  border-radius: 0;
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s;
}

.replacement-card .alt-chip:hover {
  background: var(--green);
  color: var(--bg);
  border-color: var(--green);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  font-family: 'JetBrains Mono', monospace;
  color: var(--ink-light);
  font-size: 13px;
  border: 1px dashed var(--line);
}

/* 统计栏 */
.stats-bar {
  display: flex;
  gap: 24px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  margin-bottom: 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.04em;
  color: var(--ink);
}

.stats-bar .stat {
  display: flex;
  align-items: center;
  gap: 6px;
}

.stats-bar .dot {
  width: 8px; height: 8px;
  border-radius: 0;
}

.stats-bar .dot-green { background: var(--green); }
.stats-bar .dot-yellow { background: var(--yellow); }
.stats-bar .dot-magenta { background: var(--magenta); }

/* 词库浏览 */
.lexicon-browser {
  margin-top: 40px;
  padding-top: 32px;
  border-top: 2px solid var(--ink);
}

.lexicon-browser h2 {
  font-family: 'Noto Serif SC', serif;
  font-size: 24px;
  font-weight: 500;
  margin-bottom: 20px;
}

.category-section {
  margin-bottom: 24px;
}

.category-section h3 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--green);
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
}

.word-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 8px;
}

.word-item {
  font-family: 'Noto Serif SC', serif;
  font-size: 15px;
  padding: 10px 14px;
  background: var(--bg);
  border-radius: 0;
  border: 1px solid var(--line);
}

.word-item .w-word {
  font-weight: 600;
  color: var(--ink);
}

.word-item .w-arrow {
  color: var(--ink-light);
  margin: 0 6px;
}

.word-item .w-alts {
  color: var(--ink-light);
  font-size: 13px;
}
</style>
</head>
<body>

<h1><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.16em;margin-right:8px;"><path d="M9 2v6.5L4.6 17a2 2 0 0 0 1.8 3h11.2a2 2 0 0 0 1.8-3L15 8.5V2"/><path d="M7.5 2h9"/><path d="M7 14h10"/></svg>词库 Playground</h1>
<p class="subtitle">在下面输入或粘贴你的口播稿/录音逐字稿，实时看到哪些词会被高亮，以及会弹出什么替换建议。</p>

<div class="stats-bar" id="stats">

  <div class="stat"><div class="dot dot-magenta"></div>犹豫词: <span id="stat-hedge">0</span></div>
</div>

<div class="main-layout">
  <div class="input-area">
    <textarea id="input" placeholder="在这里输入或粘贴你的口语内容...&#10;&#10;比如：我觉得今天挺开心的，感觉做了很多事情，然后嗯就是特别满足。"></textarea>
    <div class="hint"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.1em;margin-right:4px;"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>主色 = 笼统词（有替换建议） · 暗玫瑰 = 填充词 · 灰褐 = 犹豫词。点击主色词看替换卡片。</div>
    <div class="output-area" id="output">
      <span style="color:var(--ink-light);font-family:'JetBrains Mono',monospace;font-size:13px;">输入内容后这里会实时显示高亮...</span>
    </div>
  </div>

  <div class="card-panel">
    <h2>替换卡片</h2>
    <div id="cards">
      <div class="empty-state"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.1em;margin-right:5px;"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>点击左侧主色词查看替换建议</div>
    </div>
  </div>
</div>

<!-- 词库完整浏览 -->
<div class="lexicon-browser">
  <h2><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-0.16em;margin-right:8px;"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>完整词库一览（第一层 97词 + 第二层替换）</h2>
  <div id="lexicon-list"></div>
</div>

const FILLER_WORDS = ['嗯','啊','呃','额','那个','就是','然后','这个','对吧','是吧','你知道','怎么说呢','反正','基本上','总之','所以说','就是说','其实吧','说实话','对对对','是是是','emmm','啧','哎','唔'];

const HEDGE_WORDS = ['可能','也许','大概','应该','我觉得','好像','似乎','或许','不一定','差不多','算是','某种程度上','一般来说','感觉','可能吧','我不确定','大概率','不排除','也有可能'];

// 构建第一层词到替换的映射
const tier1Map = {};
const CATEGORY_NAMES = {
  'emotions_positive': '正面情绪',
  'emotions_negative': '负面情绪',
  'states': '身体状态',
  'vague_descriptors': '万能形容词',
  'vague_verbs': '万能动词',
  'intensity_markers': '程度词',
  'social_expressions': '社交用语',
  'evaluation_words': '评价用语',
  'action_words': '动作用语'
};

for (const [cat, words] of Object.entries(TIERED_LEXICON)) {
  if (cat === '_meta') continue;
  for (const [word, alts] of Object.entries(words)) {
    tier1Map[word] = { alternatives: alts, category: CATEGORY_NAMES[cat] || cat };
  }
}

// ===== 实时高亮 =====
const input = document.getElementById('input');
const output = document.getElementById('output');
const cardsDiv = document.getElementById('cards');

input.addEventListener('input', () => {
  const text = input.value;
  if (!text.trim()) {
    output.innerHTML = '<span style="color:var(--ink-light);font-family:\'Space Mono\',monospace;font-size:13px;">输入内容后这里会实时显示高亮...</span>';
    document.getElementById('stat-vague').textContent = '0';
    document.getElementById('stat-filler').textContent = '0';
    document.getElementById('stat-hedge').textContent = '0';
    return;
  }
  
  let html = text;
  let vagueCount = 0, fillerCount = 0, hedgeCount = 0;
  
  // 按长度排序（长词优先匹配，避免"我觉得"被"觉得"先匹配）
  const allTier1 = Object.keys(tier1Map).sort((a, b) => b.length - a.length);
  const allFillers = [...FILLER_WORDS].sort((a, b) => b.length - a.length);
  const allHedges = [...HEDGE_WORDS].sort((a, b) => b.length - a.length);
  
  // 标记替换（用占位符避免嵌套）
  const markers = [];
  let markerIdx = 0;
  
  // 先标记第一层词
  for (const word of allTier1) {
    const regex = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    html = html.replace(regex, () => {
      vagueCount++;
      const id = `__M${markerIdx++}__`;
      markers.push({ id, html: `<span class="highlight" data-word="${word}">${word}</span>` });
      return id;
    });
  }
  
  // 标记填充词
  for (const word of allFillers) {
    const regex = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    html = html.replace(regex, () => {
      fillerCount++;
      const id = `__M${markerIdx++}__`;
      markers.push({ id, html: `<span class="highlight-filler">${word}</span>` });
      return id;
    });
  }
  
  // 标记犹豫词
  for (const word of allHedges) {
    const regex = new RegExp(word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
    html = html.replace(regex, () => {
      hedgeCount++;
      const id = `__M${markerIdx++}__`;
      markers.push({ id, html: `<span class="highlight-hedge">${word}</span>` });
      return id;
    });
  }
  
  // 替换占位符
  for (const m of markers) {
    html = html.replace(m.id, m.html);
  }
  
  // 换行处理
  html = html.replace(/\n/g, '<br>');
  
  output.innerHTML = html;
  document.getElementById('stat-vague').textContent = vagueCount;
  document.getElementById('stat-filler').textContent = fillerCount;
  document.getElementById('stat-hedge').textContent = hedgeCount;
  
  // 绑定点击事件
  output.querySelectorAll('.highlight').forEach(el => {
    el.addEventListener('click', () => showCard(el.dataset.word));
  });
});

// ===== 替换卡片 =====
function showCard(word) {
  const info = tier1Map[word];
  if (!info) return;
  
  cardsDiv.innerHTML = `
    <div class="replacement-card">
      <div class="original">你说了：</div>
      <div class="word">「${word}」</div>
      <div class="category">${info.category}</div>
      <div class="alternatives">
        ${info.alternatives.map(alt => `<span class="alt-chip">${alt}</span>`).join('')}
      </div>
    </div>
  `;
}

// ===== 词库浏览 =====
function renderLexiconBrowser() {
  const container = document.getElementById('lexicon-list');
  let html = '';
  
  for (const [cat, words] of Object.entries(TIERED_LEXICON)) {
    if (cat === '_meta') continue;
    const catName = CATEGORY_NAMES[cat] || cat;
    
    html += `<div class="category-section">
      <h3>${catName}（${Object.keys(words).length}词）</h3>
      <div class="word-grid">`;
    
    for (const [word, alts] of Object.entries(words)) {
      html += `<div class="word-item">
        <span class="w-word">${word}</span>
        <span class="w-arrow">→</span>
        <span class="w-alts">${alts.slice(0, 3).join(' / ')}</span>
      </div>`;
    }
    
    html += '</div></div>';
  }
  
  container.innerHTML = html;
}

renderLexiconBrowser();
