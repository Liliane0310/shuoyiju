<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="s01-title s01-desc">
  <title id="s01-title">章节 01 · 这是什么</title>
  <desc id="s01-desc">章节标题:01 这是什么。灰褐编号加深酒红章节名,右侧一段说明:一款不打分、只指路的桌面训练器。</desc>
  <rect width="1200" height="140" fill="#FFFACC"/>
  <line x1="72" y1="46" x2="1128" y2="46" stroke="#53131E" stroke-width="1.2" stroke-opacity="0.35"/>
  <g font-family="'JetBrains Mono','SFMono-Regular','Menlo',ui-monospace,monospace" fill="#5A464C">
    <text x="72" y="34" font-size="14" letter-spacing="4">SECTION</text>
  </g>
  <text x="72" y="106" font-family="'JetBrains Mono','SFMono-Regular','Menlo',ui-monospace,monospace" font-size="72" font-weight="900" fill="#5A464C" letter-spacing="4">01</text>
  <text x="228" y="106" font-family="'Songti SC','STSong','Noto Serif SC','PingFang SC',serif" font-size="52" font-weight="900" fill="#53131E" letter-spacing="4">这是什么</text>
  <line x1="228" y1="120" x2="440" y2="120" stroke="#53131E" stroke-width="2"/>
  <text x="720" y="82" font-family="'Songti SC','STSong','Noto Serif SC','PingFang SC',serif" font-size="20" fill="#53131E">一款帮你把说话时的填充、犹豫、笼统词</text>
  <text x="720" y="112" font-family="'Songti SC','STSong','Noto Serif SC','PingFang SC',serif" font-size="20" fill="#53131E">当场标出来、并给出替代的桌面训练器。</text>
</svg>
