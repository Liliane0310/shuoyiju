<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="440" viewBox="0 0 1200 440"
     role="img" aria-labelledby="sd-title sd-desc">
  <title id="sd-title">说一句 · 实时字幕批注演示</title>
  <desc id="sd-desc">动画演示帧的静态源文件。展示一段真实字幕在录音过程中逐步被打上三种批注:填充词波浪下划线、犹豫词灰褐虚线下划线、笼统词深酒红反白高亮块。左下角的三个统计计数同步变化。</desc>

  <defs>
    <pattern id="sd-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#53131E" stroke-width="0.4" stroke-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="440" fill="#FFFACC"/>
  <rect width="1200" height="440" fill="url(#sd-grid)"/>

  <g id="header">
    <text x="72" y="52" font-family="'JetBrains Mono','SFMono-Regular','Menlo',ui-monospace,monospace" font-size="14" fill="#5A464C" letter-spacing="4">LIVE SUBTITLE · 00:00 → 00:12</text>
    <text x="1128" y="52" font-family="'JetBrains Mono','SFMono-Regular','Menlo',ui-monospace,monospace" font-size="14" fill="#53131E" font-weight="700" text-anchor="end" letter-spacing="2">● REC</text>
    <line x1="72" y1="66" x2="1128" y2="66" stroke="#53131E" stroke-width="0.8" stroke-opacity="0.3"/>
  </g>

  <g id="subtitle" font-family="'Songti SC','STSong','Noto Serif SC','PingFang SC',serif" font-size="42" font-weight="700" fill="#53131E">
    <text x="120" y="168">然后</text>
    <text id="w-filler" x="248" y="168">嗯</text>
    <text x="312" y="168">,</text>
    <text id="w-hedge1" x="340" y="168" fill="#5A464C">我觉得</text>
    <text x="484" y="168">这个方案</text>
    <text id="w-hedge2" x="668" y="168" fill="#5A464C">可能</text>
    <text x="762" y="168">还</text>
    <text x="120" y="240">行,</text>
    <text x="212" y="240">整体</text>
    <text id="w-vague-text" x="380" y="240" fill="#FFFACC">不错的吧</text>
    <text x="580" y="240">,大家看看。</text>
  </g>

  <g id="ann-filler">
    <path d="M 244 182 q 6 -8 12 0 t 12 0 t 12 0 t 12 0" fill="none" stroke="#53131E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <g id="ann-hedge">
    <line x1="340" y1="182" x2="480" y2="182" stroke="#5A464C" stroke-width="2.4" stroke-dasharray="6 4"/>
    <line x1="668" y1="182" x2="758" y2="182" stroke="#5A464C" stroke-width="2.4" stroke-dasharray="6 4"/>
  </g>

  <g id="ann-vague">
    <rect x="352" y="204" width="220" height="52" fill="#53131E" rx="2"/>
    <text x="462" y="243" font-family="'Songti SC','STSong','Noto Serif SC','PingFang SC',serif" font-size="42" font-weight="900" fill="#FFFACC" text-anchor="middle">不错的吧</text>
  </g>

  <line x1="72" y1="312" x2="1128" y2="312" stroke="#53131E" stroke-width="0.6" stroke-opacity="0.3"/>

  <g id="stats" font-family="'JetBrains Mono','SFMono-Regular','Menlo',ui-monospace,monospace" fill="#53131E">
    <g transform="translate(96 340)">
      <path d="M 0 22 q 4.5 -6 9 0 t 9 0" fill="none" stroke="#53131E" stroke-width="2" stroke-linecap="round"/>
      <text x="34" y="18" font-size="14" fill="#5A464C" letter-spacing="2">填充词</text>
      <text id="stat-filler" x="34" y="42" font-size="32" font-weight="900">1</text>
    </g>
    <g transform="translate(340 340)">
      <line x1="0" y1="20" x2="24" y2="20" stroke="#5A464C" stroke-width="1.8" stroke-dasharray="4 3"/>
      <text x="34" y="18" font-size="14" fill="#5A464C" letter-spacing="2">犹豫词</text>
      <text id="stat-hedge" x="34" y="42" font-size="32" font-weight="900">2</text>
    </g>
    <g transform="translate(584 340)">
      <rect x="0" y="10" width="24" height="16" fill="#53131E" rx="1.5"/>
      <text x="34" y="18" font-size="14" fill="#5A464C" letter-spacing="2">笼统词</text>
      <text id="stat-vague" x="34" y="42" font-size="32" font-weight="900">1</text>
    </g>
    <g transform="translate(828 340)">
      <text x="0" y="18" font-size="14" fill="#5A464C" letter-spacing="2">表达密度</text>
      <text id="stat-density" x="0" y="42" font-size="32" font-weight="900">57%</text>
    </g>
  </g>

  <text x="72" y="410" font-family="'Songti SC','STSong','Noto Serif SC','PingFang SC',serif" font-size="16" fill="#5A464C">说话 → 字幕实时出现 → 词库匹配 → 三种批注就地叠加 → 左下计数同步变化。</text>
</svg>
